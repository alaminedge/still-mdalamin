name: Build STILL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore folders from flat file names
        run: |
          for f in *__*; do
            [ -f "$f" ] || continue
            t=$(echo "$f" | sed 's/__/\//g')
            mkdir -p "$(dirname "$t")"
            mv "$f" "$t"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk STILL-build-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: STILL build ${{ github.run_number }}
          make_latest: true
          files: STILL-build-${{ github.run_number }}.apk
